<!-- @dsCard group="Colors" viewport="700x150" name="Brand — Vitan Green" subtitle="Signature accent + tint" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; font-family: var(--font-text); }
  .row { display: flex; gap: 12px; }
  .sw { flex: 1; height: 96px; border-radius: var(--radius-md); display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; box-shadow: var(--shadow-card); }
  .sw b { font: 600 13px/1.2 var(--font-text); }
  .sw span { font: var(--t-caption1); opacity: 0.75; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background: var(--vitan); color: #fff;"><b>Vitan</b><span>#10C775</span></div>
    <div class="sw" style="background: var(--vitan-strong); color: #fff;"><b>Strong</b><span>#0BA862</span></div>
    <div class="sw" style="background: var(--vitan-soft); color: #064a2f;"><b>Soft</b><span>#5BE0A8</span></div>
    <div class="sw" style="background: var(--vitan-tint); color: var(--vitan-strong);"><b>Tint</b><span>14% green</span></div>
  </div>
</body>
</html>
