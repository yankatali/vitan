<!-- @dsCard group="Colors" viewport="700x160" name="iOS System Colors" subtitle="Semantic system palette" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; font-family: var(--font-text); }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .sw { height: 90px; border-radius: var(--radius-sm); display: flex; flex-direction: column; justify-content: flex-end; padding: 8px; color: #fff; box-shadow: var(--shadow-card); }
  .sw b { font: 600 12px/1.2 var(--font-text); }
  .sw span { font: 400 10px/1.2 var(--font-text); opacity: 0.85; }
</style>
</head>
<body>
  <div class="grid">
    <div class="sw" style="background: var(--sys-blue)"><b>Blue</b><span>links</span></div>
    <div class="sw" style="background: var(--sys-green)"><b>Green</b><span>success</span></div>
    <div class="sw" style="background: var(--sys-red)"><b>Red</b><span>delete</span></div>
    <div class="sw" style="background: var(--sys-orange)"><b>Orange</b><span>sale</span></div>
    <div class="sw" style="background: var(--sys-pink)"><b>Pink</b><span>favorite</span></div>
    <div class="sw" style="background: var(--sys-purple)"><b>Purple</b><span></span></div>
    <div class="sw" style="background: var(--sys-indigo)"><b>Indigo</b><span></span></div>
    <div class="sw" style="background: var(--sys-teal)"><b>Teal</b><span></span></div>
    <div class="sw" style="background: var(--sys-cyan)"><b>Cyan</b><span></span></div>
    <div class="sw" style="background: var(--sys-mint)"><b>Mint</b><span></span></div>
    <div class="sw" style="background: var(--sys-yellow); color:#5a4a00"><b>Yellow</b><span></span></div>
    <div class="sw" style="background: var(--bg); color: var(--label)"><b>BG</b><span>#F2F2F7</span></div>
  </div>
</body>
</html>
