<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 22px; font-family: var(--font-display); color: var(--label); }
  .row { display: flex; align-items: baseline; gap: 14px; margin-bottom: 12px; }
  .row .spec { font: var(--t-caption1); color: var(--label-tertiary); font-family: var(--font-mono); white-space: nowrap; }
  .lt { font: var(--t-largetitle); letter-spacing: -0.4px; }
  .t1 { font: var(--t-title1); letter-spacing: -0.4px; }
  .t2 { font: var(--t-title2); letter-spacing: -0.4px; }
  .t3 { font: var(--t-title3); }
</style>
</head>
<body>
  <div class="row"><span class="lt">Vitan</span><span class="spec">Large Title · 34/41 · 700</span></div>
  <div class="row"><span class="t1">Find your things</span><span class="spec">Title 1 · 28/34 · 700</span></div>
  <div class="row"><span class="t2">New this week</span><span class="spec">Title 2 · 22/28 · 700</span></div>
  <div class="row"><span class="t3">Walnut Side Table</span><span class="spec">Title 3 · 20/25 · 600</span></div>
</body>
</html>
