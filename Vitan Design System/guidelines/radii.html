<!-- @dsCard group="Spacing" viewport="700x150" name="Corner Radii" subtitle="Continuous radii — xs → capsule" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; font-family: var(--font-text); }
  .row { display: flex; gap: 14px; align-items: flex-end; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; flex: 1; }
  .box { width: 100%; height: 72px; background: var(--vitan-tint); border: 1.5px solid var(--vitan); }
  .lab { font: 400 11px/1.3 var(--font-mono); color: var(--label-tertiary); text-align: center; }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius: var(--radius-xs)"></div><span class="lab">xs 8</span></div>
    <div class="item"><div class="box" style="border-radius: var(--radius-sm)"></div><span class="lab">sm 12</span></div>
    <div class="item"><div class="box" style="border-radius: var(--radius-md)"></div><span class="lab">md 16</span></div>
    <div class="item"><div class="box" style="border-radius: var(--radius-lg)"></div><span class="lab">lg 20</span></div>
    <div class="item"><div class="box" style="border-radius: var(--radius-xl)"></div><span class="lab">xl 26</span></div>
    <div class="item"><div class="box" style="border-radius: var(--radius-2xl)"></div><span class="lab">2xl 34</span></div>
    <div class="item"><div class="box" style="border-radius: var(--radius-capsule)"></div><span class="lab">capsule</span></div>
  </div>
</body>
</html>
