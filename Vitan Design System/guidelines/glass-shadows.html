<!-- @dsCard group="Glass" viewport="700x170" name="Shadows & Float" subtitle="card / glass / float elevation" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 28px; font-family: var(--font-text); background: var(--bg); }
  .row { display: flex; gap: 22px; }
  .pane { flex: 1; height: 96px; background: #fff; border-radius: var(--radius-md); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
  .pane b { font: 600 14px/1 var(--font-text); color: var(--label); }
  .pane span { font: 400 11px/1 var(--font-mono); color: var(--label-tertiary); }
</style>
</head>
<body>
  <div class="row">
    <div class="pane" style="box-shadow: var(--shadow-card)"><b>Card</b><span>--shadow-card</span></div>
    <div class="pane" style="box-shadow: var(--shadow-glass)"><b>Glass</b><span>--shadow-glass</span></div>
    <div class="pane" style="box-shadow: var(--shadow-float)"><b>Float</b><span>--shadow-float</span></div>
  </div>
</body>
</html>
