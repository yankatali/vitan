<!-- @dsCard group="Colors" viewport="700x170" name="Labels & Fills" subtitle="Alpha-based neutrals (iOS convention)" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; font-family: var(--font-text); }
  .stack { display: grid; gap: 14px; }
  .lbls { display: flex; gap: 24px; align-items: baseline; }
  .lbls span { font: 600 17px/1 var(--font-text); }
  .fills { display: flex; gap: 12px; }
  .chip { flex: 1; height: 52px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font: var(--t-caption1); color: var(--label-secondary); }
  .sep { height: 1px; background: var(--separator); }
  .cap { font: var(--t-caption1); color: var(--label-tertiary); }
</style>
</head>
<body>
  <div class="stack">
    <div class="lbls">
      <span style="color: var(--label)">Label</span>
      <span style="color: var(--label-secondary)">Secondary</span>
      <span style="color: var(--label-tertiary)">Tertiary</span>
      <span style="color: var(--label-quaternary)">Quaternary</span>
    </div>
    <div class="fills">
      <div class="chip" style="background: var(--fill)">fill .12</div>
      <div class="chip" style="background: var(--fill-secondary)">secondary .16</div>
      <div class="chip" style="background: var(--fill-tertiary)">tertiary .08</div>
    </div>
    <div class="sep"></div>
    <div class="cap">— separator hairline (rgba 60,60,67 / .20)</div>
  </div>
</body>
</html>
