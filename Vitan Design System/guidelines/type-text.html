<!-- @dsCard group="Type" viewport="700x250" name="Text & Captions" subtitle="SF Pro Text — Headline → Caption" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 22px; font-family: var(--font-text); color: var(--label); }
  .row { display: flex; align-items: baseline; gap: 14px; margin-bottom: 11px; }
  .row .spec { font: 400 11px/1 var(--font-mono); color: var(--label-tertiary); white-space: nowrap; margin-left: auto; }
  .headline { font: var(--t-headline); }
  .body { font: var(--t-body); }
  .callout { font: var(--t-callout); }
  .subhead { font: var(--t-subhead); color: var(--label-secondary); }
  .footnote { font: var(--t-footnote); color: var(--label-secondary); }
  .caption { font: var(--t-caption1); color: var(--label-tertiary); }
</style>
</head>
<body>
  <div class="row"><span class="headline">Add to Cart</span><span class="spec">Headline · 17 · 600</span></div>
  <div class="row"><span class="body">Solid walnut, hand-oiled finish.</span><span class="spec">Body · 17 · 400</span></div>
  <div class="row"><span class="callout">Free local pickup available.</span><span class="spec">Callout · 16</span></div>
  <div class="row"><span class="subhead">Listed 2 days ago in Furniture</span><span class="spec">Subhead · 15</span></div>
  <div class="row"><span class="footnote">Ships in 3–5 business days</span><span class="spec">Footnote · 13</span></div>
  <div class="row"><span class="caption">UPDATED JUST NOW</span><span class="spec">Caption · 12</span></div>
</body>
</html>
