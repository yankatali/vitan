<!-- @dsCard group="Vitan App" viewport="430x880" name="Vitan — Catalog App" subtitle="Interactive: browse, filter, sort, favorite, create/edit, cart" -->
<!-- @startingPoint section="Vitan App" subtitle="Full Liquid Glass product-catalog app" viewport="430x880" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Vitan</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: #DCDCE2; display: flex; justify-content: center; }
  .app {
    position: relative;
    width: 430px; max-width: 100%; height: 100vh;
    overflow: hidden;
    transform: translateZ(0);            /* contains fixed descendants */
    box-shadow: 0 0 60px rgba(0,0,0,0.18);
  }
  #root { height: 100%; }
  .scroll { height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .scroll::-webkit-scrollbar { width: 0; }
</style>
</head>
<body>
<div class="app vitan-canvas">
  <div id="root"></div>
</div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="data.js"></script>
<script type="text/babel" src="Catalog.jsx"></script>
<script type="text/babel" src="ProductDetail.jsx"></script>
<script type="text/babel" src="ItemForm.jsx"></script>
<script type="text/babel" src="FiltersSheet.jsx"></script>

<script type="text/babel">
const { TabBar, Toast, GlassPanel, Button } = window.VitanDesignSystem_b00aee;
const D = window.VITAN_DATA;

function EmptyTab({ icon, title, sub }) {
  return (
    <div style={{ height: "100%", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 10, padding: 32, textAlign: "center" }}>
      <GlassPanel style={{ width: 84, height: 84, borderRadius: 28, display: "flex", alignItems: "center", justifyContent: "center" }}>
        <i className={icon} style={{ fontSize: 38, color: "var(--accent)" }} />
      </GlassPanel>
      <h2 style={{ margin: "8px 0 0", font: "var(--t-title2)", letterSpacing: "-0.4px", color: "var(--text-primary)" }}>{title}</h2>
      <p style={{ margin: 0, font: "var(--t-body)", color: "var(--text-secondary)", maxWidth: 260 }}>{sub}</p>
    </div>
  );
}

function App() {
  const [products, setProducts] = React.useState(D.products);
  const [favs, setFavs] = React.useState({ p2: true });
  const [cart, setCart] = React.useState([]);
  const [tab, setTab] = React.useState("shop");
  const [view, setView] = React.useState({ name: "catalog", product: null });

  // catalog controls
  const [query, setQuery] = React.useState("");
  const [scope, setScope] = React.useState("all");
  const [cats, setCats] = React.useState([]);
  const [sort, setSort] = React.useState("recent");

  // overlays
  const [filtersOpen, setFiltersOpen] = React.useState(false);
  const [formItem, setFormItem] = React.useState(undefined); // undefined=closed, null=create, obj=edit
  const [toast, setToast] = React.useState({ open: false, message: "", icon: undefined, tone: "accent" });
  const toastTimer = React.useRef(null);

  const flash = (message, opts = {}) => {
    setToast({ open: true, message, icon: opts.icon, tone: opts.tone || "accent" });
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast((t) => ({ ...t, open: false })), 1700);
  };

  const toggleFav = (id) => {
    setFavs((f) => { const n = { ...f, [id]: !f[id] }; flash(n[id] ? "Saved to Favorites" : "Removed from Favorites", { icon: "ph-fill ph-heart", tone: "favorite" }); return n; });
  };
  const addToCart = (p) => { setCart((c) => [...c, p.id]); flash("Added to cart"); };
  const saveItem = (data) => {
    if (data.id) {
      setProducts((ps) => ps.map((p) => p.id === data.id ? { ...p, ...data } : p));
      flash("Changes saved");
    } else {
      const id = "p" + (Date.now());
      setProducts((ps) => [{ ...data, id, stock: true, owner: true, images: ["vitan-new-" + id] }, ...ps]);
      flash("Item added");
    }
    setFormItem(undefined);
  };
  const deleteItem = (p) => {
    setProducts((ps) => ps.filter((x) => x.id !== p.id));
    if (view.name === "detail") setView({ name: "catalog", product: null });
    flash("Item deleted", { icon: "ph-fill ph-trash", tone: "neutral" });
  };

  // derive visible products
  const visible = React.useMemo(() => {
    let list = products.slice();
    if (tab === "favorites") list = list.filter((p) => favs[p.id]);
    if (query.trim()) { const q = query.toLowerCase(); list = list.filter((p) => p.name.toLowerCase().includes(q) || p.description.toLowerCase().includes(q)); }
    if (scope === "stock") list = list.filter((p) => p.stock);
    if (scope === "sale") list = list.filter((p) => p.compareAt);
    if (cats.length) list = list.filter((p) => cats.includes(p.category));
    const dir = 1;
    list.sort((a, b) => {
      if (sort === "price-asc") return a.price - b.price;
      if (sort === "price-desc") return b.price - a.price;
      if (sort === "name") return a.name.localeCompare(b.name);
      return 0; // recent = original order (newest first already)
    });
    return list;
  }, [products, favs, tab, query, scope, cats, sort]);

  const activeFilterCount = (scope !== "all" ? 1 : 0) + cats.length;
  const clearFilters = () => { setScope("all"); setCats([]); };

  const openProduct = (p) => { setView({ name: "detail", product: p }); document.querySelector(".scroll").scrollTop = 0; };
  const back = () => setView({ name: "catalog", product: null });

  const tabItems = [
    { value: "shop", label: "Shop", icon: "ph-storefront" },
    { value: "favorites", label: "Favorites", icon: "ph-heart", badge: Object.values(favs).filter(Boolean).length || undefined },
    { value: "cart", label: "Cart", icon: "ph-shopping-bag", badge: cart.length || undefined },
    { value: "profile", label: "Profile", icon: "ph-user" },
  ];

  let screen;
  if (view.name === "detail" && view.product) {
    const live = products.find((p) => p.id === view.product.id) || view.product;
    screen = <ProductDetail product={live} fav={!!favs[live.id]} onToggleFav={() => toggleFav(live.id)} onBack={back} onAddToCart={addToCart} onEdit={() => setFormItem(live)} onDelete={() => deleteItem(live)} />;
  } else if (tab === "cart") {
    screen = <EmptyTab icon="ph ph-shopping-bag" title={cart.length ? `${cart.length} in your cart` : "Your cart is empty"} sub={cart.length ? "Checkout is out of scope for this kit." : "Items you add to cart show up here."} />;
  } else if (tab === "profile") {
    screen = <EmptyTab icon="ph ph-user" title="Your Profile" sub="Listings, orders, and settings live here." />;
  } else {
    screen = (
      <Catalog
        products={visible} favs={favs}
        onToggleFav={toggleFav} onAddToCart={addToCart}
        onOpen={openProduct} onCreate={() => setFormItem(null)}
        onEdit={(p) => setFormItem(p)} onDelete={deleteItem}
        onOpenFilters={() => setFiltersOpen(true)}
        query={query} setQuery={setQuery}
        activeFilterCount={activeFilterCount}
        sort={sort} setSort={setSort}
      />
    );
  }

  const showTabBar = view.name !== "detail";

  return (
    <React.Fragment>
      <div className="scroll" key={view.name + tab}>{screen}</div>
      {showTabBar && <TabBar items={tabItems} value={tab} onChange={(t) => { setTab(t); back(); }} />}
      <FiltersSheet open={filtersOpen} onClose={() => setFiltersOpen(false)} scope={scope} setScope={setScope} cats={cats} setCats={setCats} onClear={clearFilters} />
      <ItemForm open={formItem !== undefined} item={formItem || null} onClose={() => setFormItem(undefined)} onSave={saveItem} />
      <Toast open={toast.open} message={toast.message} icon={toast.icon} tone={toast.tone} />
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
