<!-- @dsCard group="Components" viewport="700x520" name="Feedback — Sheet & Toast" subtitle="Liquid Glass bottom sheet + confirmation toast" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<style>
  body { margin: 0; }
  .wrap { box-sizing: border-box; min-height: 520px; position: relative; overflow: hidden; }
  .blob { position: absolute; border-radius: 50%; }
  .grp { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
  .lab { font: 600 13px/1 var(--font-text); color: var(--label-secondary); margin: 4px 0 10px; }
</style>
</head>
<body>
<div class="wrap vitan-canvas">
  <div class="blob" style="width:200px;height:200px;background:var(--sys-orange);opacity:.4;top:20px;left:60px"></div>
  <div class="blob" style="width:160px;height:160px;background:var(--sys-blue);opacity:.4;top:40px;right:60px"></div>
  <div id="root"></div>
</div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { Sheet, Toast, FilterChip, Button, SegmentedControl } = window.VitanDesignSystem_b00aee;
  function Demo() {
    const [scope, setScope] = React.useState("all");
    const [sel, setSel] = React.useState(["furniture"]);
    const toggle = (k) => setSel(s => s.includes(k) ? s.filter(x=>x!==k) : [...s, k]);
    return (
      <React.Fragment>
        <Toast open message="Added to cart" style={{ bottom: "auto", top: 22 }} />
        <Sheet open={true} title="Filters"
          footer={<div style={{display:"flex",gap:10}}>
            <Button variant="glass" style={{flex:1}}>Clear All</Button>
            <Button variant="accent" style={{flex:2}}>Apply Filters</Button>
          </div>}>
          <div className="lab">Availability</div>
          <div className="grp">
            <SegmentedControl options={["All","In Stock","On Sale"].map(l=>({label:l,value:l.toLowerCase().replace(/ /g,"")}))} value={scope} onChange={setScope} />
          </div>
          <div className="lab">Category</div>
          <div className="grp">
            {[["furniture","ph ph-armchair"],["lighting","ph ph-lamp"],["plants","ph ph-plant"],["decor","ph ph-frame-corners"],["kitchen","ph ph-cooking-pot"]].map(([k,ic])=>(
              <FilterChip key={k} icon={ic} selected={sel.includes(k)} onClick={()=>toggle(k)}>{k[0].toUpperCase()+k.slice(1)}</FilterChip>
            ))}
          </div>
        </Sheet>
      </React.Fragment>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
