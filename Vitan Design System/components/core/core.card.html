<!-- @dsCard group="Components" viewport="700x430" name="Core — Buttons, Fields, Controls" subtitle="Button · IconButton · Search · Filter · Sort · Segmented · Badge" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<style>
  body { margin: 0; }
  .wrap { padding: 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px; }
  .group { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .cap { font: 600 11px/1 var(--font-text); letter-spacing: 0.4px; text-transform: uppercase; color: var(--label-tertiary); margin-bottom: -6px; }
</style>
</head>
<body>
<div class="wrap vitan-canvas">
  <div id="root"></div>
</div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { Button, IconButton, SearchField, FilterChip, SortControl, SegmentedControl, Badge } = window.VitanDesignSystem_b00aee;
  function Demo() {
    const [seg, setSeg] = React.useState("all");
    const [dir, setDir] = React.useState("desc");
    const [q, setQ] = React.useState("");
    const Cap = ({children}) => <div className="cap">{children}</div>;
    return (
      <React.Fragment>
        <Cap>Buttons</Cap>
        <div className="group">
          <Button variant="accent" icon="ph ph-shopping-bag">Add to Cart</Button>
          <Button variant="glass">Apply Filters</Button>
          <Button variant="tinted">Save</Button>
          <Button variant="destructive" icon="ph ph-trash">Delete</Button>
          <Button variant="plain">Cancel</Button>
        </div>
        <Cap>Icon buttons</Cap>
        <div className="group">
          <IconButton icon="ph ph-magnifying-glass" label="Search" />
          <IconButton icon="ph ph-plus" variant="accent" label="New" />
          <IconButton icon="ph-fill ph-heart" active activeColor="var(--favorite)" label="Fav" />
          <IconButton icon="ph ph-sliders-horizontal" variant="fill" label="Filters" />
          <Badge tone="accent">In Stock</Badge>
          <Badge tone="sale" solid>-20%</Badge>
        </div>
        <Cap>Search · Sort</Cap>
        <div className="group">
          <div style={{flex:1, minWidth: 200}}><SearchField value={q} onChange={e=>setQ(e.target.value)} onClear={()=>setQ("")} placeholder="Search items" /></div>
          <SortControl label="Price" direction={dir} onToggleDirection={()=>setDir(d=>d==="asc"?"desc":"asc")} />
        </div>
        <Cap>Segmented · Filter chips</Cap>
        <div className="group">
          <SegmentedControl options={["All","In Stock","On Sale"].map(l=>({label:l,value:l.toLowerCase().replace(/ /g,"")}))} value={seg} onChange={setSeg} />
        </div>
        <div className="group">
          <FilterChip selected icon="ph ph-armchair">Furniture</FilterChip>
          <FilterChip icon="ph ph-lamp">Lighting</FilterChip>
          <FilterChip icon="ph ph-plant">Plants</FilterChip>
        </div>
      </React.Fragment>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
