<!-- @dsCard group="Components" viewport="700x500" name="Product — ProductCard, PriceTag, Favorite" subtitle="The central catalog card + price & favorite primitives" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<style>
  body { margin: 0; }
  .wrap { padding: 24px; box-sizing: border-box; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
</style>
</head>
<body>
<div class="wrap vitan-canvas"><div id="root"></div></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { ProductCard } = window.VitanDesignSystem_b00aee;
  const img = (s) => `https://picsum.photos/seed/${s}/600/600`;
  function Demo() {
    const [f1, setF1] = React.useState(true);
    const [f2, setF2] = React.useState(false);
    return (
      <div className="grid">
        <ProductCard
          name="Walnut Side Table" price={129} compareAt={159}
          description="Solid walnut, hand-oiled finish. 45cm tall, ships flat."
          images={[img("table1"), img("table2"), img("table3")]}
          badge={{label:"-20%", tone:"sale", solid:true}}
          favorite={f1} onToggleFavorite={setF1} />
        <ProductCard
          name="Ceramic Planter" price={34}
          description="Matte stoneware with drainage tray. Three sizes."
          images={[img("planter1"), img("planter2")]}
          favorite={f2} onToggleFavorite={setF2}
          owner />
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
